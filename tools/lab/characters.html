<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexsurge · Character atelier</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131525;color:#eae4fa;font-family:system-ui,sans-serif}header{height:112px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #464059;background:linear-gradient(120deg,#28263e,#131525)}h1{margin:0;font-size:24px;letter-spacing:.04em}small{display:block;margin-top:6px;color:#b7afc8}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,label{min-height:44px;border:1px solid #655777;background:#2d2941;color:inherit;border-radius:8px;padding:10px 14px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#755aa4;border-color:#c6a1ed}label{display:flex;gap:8px;align-items:center}input{accent-color:#c89cf6}main{height:calc(100% - 112px);position:relative}canvas{width:100%;height:100%;display:block}#labels{position:absolute;inset:0;pointer-events:none}.name{position:absolute;text-align:center;transform:translate(-50%,0);font-size:15px;font-weight:650;white-space:nowrap;text-shadow:0 2px 8px #000}.name span{display:block;color:#bfb5d2;font-size:11px;font-weight:400;margin-top:4px}#status{position:absolute;bottom:12px;left:20px;font-size:11px;letter-spacing:.08em;color:#a59ab6}@media(max-width:800px){header{height:160px;padding:10px;align-items:start;flex-direction:column}h1{font-size:18px}main{height:calc(100% - 160px)}nav{gap:4px}button,select,label{padding:8px;font-size:12px}.name{font-size:12px}.name span{font-size:9px}}
</style></head><body><header><div><h1 id="heading"></h1><small id="subtitle"></small></div><nav><button id="mages" aria-pressed="true"></button><button id="bosses" aria-pressed="false"></button><label><input id="walk" type="checkbox"><span id="walkText"></span></label><label><input id="cast" type="checkbox"><span id="castText"></span></label><label><input id="rage" type="checkbox"><span id="rageText"></span></label><select id="tier"></select><select id="lang" aria-label="Language"><option value="en">English</option><option value="zh">繁體中文</option><option value="ja">日本語</option></select></nav></header><main><canvas id="game"></canvas><div id="labels"></div><div id="status"></div></main><script type="module" src="./characters.js"></script></body></html>
